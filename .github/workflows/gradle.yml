# This is a basic workflow to help you get started with the Run Jtest action.
name: Jtest with Gradle

on:
  # Trigger the workflow on push or pull request events but only for the main branch.
  push:
    branches: [ branch1 ]
  pull_request:
    branches: [ branch1 ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  build:
    name: Analyze project with Jtest
    
    permissions:
      # required for all workflows
      security-events: write
      
    # Specifies the type of runner that the job will run on.
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
    
    # Checks out your repository under $GITHUB_WORKSPACE, so that your job can access it.
    - name: Checkout repository
      uses: actions/checkout@v6
      with:  
       ref: 'branch1'
       fetch-depth: 0
       set-safe-directory: true

    # Use git command and add safe.directory which potentially solves 
    # the issue with Test Configuration > Scope > "Test only files modified between the current working branch and 'main'"
    # - name: Git commands and safe.directory
      # shell: cmd
      # run: git fetch --all |
           # git rev-parse --verify --quiet branch1 |
           # git config --global --add safe.directory "C:\actions-runner2331_jtest2025.2.2\_work\jtest_demo\jtest_demo"
    - name: Git commands and safe.directory
      shell: cmd
      run: git fetch --all |
           git rev-parse --verify --quiet branch1 |
           git config --global --add safe.directory "${{ github.workspace }}"
      
    # Generates the jtest.data.json input file.
    - name: Create input for Jtest
      shell: cmd
      run: .\gradlew clean build jtest -I ${{ env.JTEST }}/integration/gradle/init.gradle "-Djtest.config=builtin://Recommended Rules" "-Djtest.report=reports"

    # Uploads analysis results in the SARIF format, so that they are displayed as GitHub code scanning alerts.
    - name: Upload results (SARIF)
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        #sarif_file: reports/report.sarif # reports is a default location for reports directory
        #sarif_file: c:/actions-runner2331_jtest2025.2.2/_work/jtest_demo/jtest_demo/reports/report.sarif
        sarif_file: "${{ github.workspace }}/reports/report.sarif"
        category: parasoft-jtest-SoftCode4
        #checkout_path: c:/actions-runner2331_jtest2025.2.2/_work/jtest_demo/jtest_demo        
        #matrix: null
        wait-for-processing: true
