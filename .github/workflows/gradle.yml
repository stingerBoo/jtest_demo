# This is a basic workflow to help you get started with the Run Jtest action.
name: Scope diff on branches

on:
  # Trigger the workflow on push or pull request events but only for the main branch.
  push:
    branches: [ branch1 ]
  pull_request:
    branches: [ branch1 ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  build:
    name: Analyze project with Jtest
    
    permissions:
      # required for all workflows
      security-events: write
      
    # Specifies the type of runner that the job will run on.
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
    
    # Checks out your repository under $GITHUB_WORKSPACE, so that your job can access it.
    - name: Checkout repository
      uses: actions/checkout@v6
      with:  
       ref: 'main'
       fetch-depth: 0
       set-safe-directory: true
    
    - name: Git commands and safe.directory
      shell: cmd
      run: git fetch --all |
           git rev-parse --verify --quiet branch1 |
           git config --global --add safe.directory "${{ github.workspace }}"
    
    - name: Modified files Simple.java
      run: |
          git blame src/main/java/examples/eval/Simple.java
      shell: cmd          
    # Generates the jtest.data.json input file.
    - name: Create input for Jtest
      shell: cmd
      run: .\gradlew clean build jtest -I "%JTEST_HOME%/integration/gradle/init.gradle" "-Djtest.config=user://Recommended Rules scope diff branches" "-Djtest.settings=${{ github.workspace }}/jtestsettings.properties" "-Djtest.report=reports" 

    # Uploads analysis results in the SARIF format, so that they are displayed as GitHub code scanning alerts.
    - name: Upload results (SARIF)
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:        
        sarif_file: "${{ github.workspace }}/reports/report.sarif"
        category: parasoft-jtest-SoftCode4
        wait-for-processing: true
