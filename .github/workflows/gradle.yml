# This is a basic workflow to help you get started with the Run Jtest action.
name: Container Jtest with Gradle

on:
  # Trigger the workflow on push or pull request events but only for the main branch.
  push:
    branches: [ container ]
  pull_request:
    branches: [ container ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  build:
    name: Analyze project with Jtest container
    
    permissions:
      # required for all workflows
      security-events: write
      
    # Specifies the type of runner that the job will run on.
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
    
    # Checks out your repository under $GITHUB_WORKSPACE, so that your job can access it.
    - name: Checkout repository
      uses: actions/checkout@v6
      #uses: actions/checkout@v5     
      #uses: actions/checkout@v6
      with:
       ref: container
       fetch-depth: 0 

    # this is a usage of continer on localmachine where it's on windows with docker.
    # the image is created on fly here.  
    # DTP_HOST setup:
    # 1. GitHub -> Settings -> Secrets and variables -> Actions -> press New repository secret.
    # 2. In field Name write: DTP_HOST
    # 3. In field Secret write: fullHost.com.name    
    - name: Run Container
      env:
        DTP_HOST: ${{ secrets.DTP_HOST }}    
      run: >
       docker run
       --rm
       --add-host="%DTP_HOST%:host-gateway"       
       -v "${{ github.workspace }}:/home/parasoft/example"
       -v "${{ github.workspace }}/jtestcli.properties:/opt/parasoft/jtest/jtestcli.properties"
       --name c_jtest2026.2 parasoft/jtest:2026.2
       jtestcli -data "/home/parasoft/example/demo.data.json" -config "builtin://Recommended Rules" -report /home/parasoft/example/reports
      shell: cmd

      # Uploads analysis results in the SARIF format, so that they are displayed as GitHub code scanning alerts.
    - name: Upload results (SARIF)
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        #sarif_file: reports/report.sarif # reports is a default location for reports directory
        # below report contains error because it contains violation from custom rule. Reproduce of case: 00106709        
        
        # below report should be fine after update. Reproduce of case: 00106709
        sarif_file: "${{ github.workspace }}/reports/report.sarif"
        wait-for-processing: true
